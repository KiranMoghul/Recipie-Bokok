<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Book</title>
  <meta name="description" content="Recipes by cuisine that scale to any number of people and switch between grams and cups.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="#">Recipe Book</a>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes or ingredients" autocomplete="off">
      </label>
    </div>
  </header>

  <main id="app"><div class="wrap empty">Loading recipes…</div></main>

  <div class="cook" id="cook" hidden role="dialog" aria-modal="true" aria-labelledby="cook-title">
    <div class="cook-top">
      <strong id="cook-title"></strong>
      <div class="progress" aria-hidden="true"><span id="cook-bar"></span></div>
      <button type="button" class="btn" id="cook-close">Exit</button>
    </div>
    <div class="cook-main">
      <div class="inner">
        <div class="cook-step-no" id="cook-no"></div>
        <p class="cook-text" id="cook-text"></p>
        <div class="cook-uses" id="cook-uses"></div>
      </div>
    </div>
    <div class="cook-bottom">
      <button type="button" class="btn" id="cook-prev">← Back</button>
      <button type="button" class="btn primary" id="cook-next">Next step →</button>
    </div>
  </div>

  <div class="timers" id="timers" aria-live="polite"></div>

  <script src="assets/units.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
